name: Build NEXUS

on:
  push:
    branches: [main, project-foundation]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test bounded ZIP inspector
        run: python3 -m unittest discover -s Tests/Tools -v
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build iOS Simulator
        run: xcodebuild -project NEXUS.xcodeproj -scheme NEXUS-iOS -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Build tvOS Simulator
        run: xcodebuild -project NEXUS.xcodeproj -scheme NEXUS-tvOS -destination 'generic/platform=tvOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Test iOS unit tests
        run: xcodebuild -project NEXUS.xcodeproj -scheme NEXUS-iOSTests -destination 'platform=iOS Simulator,name=iPhone 16' CODE_SIGNING_ALLOWED=NO test

name: NEXUS
options:
  bundleIdPrefix: com.nexusstream
  deploymentTarget:
    iOS: "17.0"
    tvOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  NEXUS-iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nexusstream.ios
        INFOPLIST_KEY_CFBundleDisplayName: NEXUS
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO

  NEXUS-tvOS:
    type: application
    platform: tvOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nexusstream.tvos
        INFOPLIST_KEY_CFBundleDisplayName: NEXUS
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "3"

  NEXUS-iOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/iOS
    dependencies:
      - target: NEXUS-iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nexusstream.ios.tests
        GENERATE_INFOPLIST_FILE: YES
